name: GGNews Rocket League

on:

  # فحص مرة كل ساعة
  schedule:
    - cron: "0 * * * *"

  # يسمح لك بتشغيله يدوياً
  workflow_dispatch:


permissions:
  contents: write


concurrency:

  group: rocket-league-news

  cancel-in-progress: false


jobs:

  publish:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:


      # ==========================================
      # تحميل المشروع
      # ==========================================

      - name: Checkout

        uses: actions/checkout@v4


      # ==========================================
      # Python
      # ==========================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ==========================================
      # تثبيت المكتبات
      # ==========================================

      - name: Install dependencies

        run: |

          pip install -r requirements.txt


      # ==========================================
      # تشغيل محرك الأخبار
      # ==========================================

      - name: Run GGNews Rocket League

        env:

          DISCORD_WEBHOOK_URL:
            ${{ secrets.DISCORD_WEBHOOK_URL }}

          GEMINI_API_KEY:
            ${{ secrets.GEMINI_API_KEY }}

        run: |

          python send_news.py


      # ==========================================
      # حفظ سجل الأخبار
      # ==========================================

      - name: Save news history

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sent.json

          git diff --cached --quiet || git commit -m "Update Rocket League news history"

          git push
